<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="35%" stop-color="#0EA5E9"/>
      <stop offset="70%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Bevel & Inner Highlight Gradient -->
    <linearGradient id="favBevelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Circuit & Letter J/T Gradient -->
    <linearGradient id="favLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Inner Shield Surface Gradient -->
    <linearGradient id="favInnerShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#DCEBFE"/>
    </linearGradient>

    <!-- Glow Filter for Nodes & Circuits -->
    <filter id="favNodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="favShieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#favShieldShadow)">
    <!-- 1. Outer Metallic Shield -->
    <path d="M 250 24 
             L 394 74 
             C 410 170, 395 320, 250 440 
             C 105 320, 90 170, 106 74 
             Z" 
          fill="url(#favShieldGrad)" />

    <!-- 2. Shield Bevel Ridge / Facet Lines -->
    <path d="M 250 24 L 250 56 L 372 98 C 386 182, 370 310, 250 416 L 250 440 C 395 320, 410 170, 394 74 Z" 
          fill="#000000" fill-opacity="0.18" />
    <path d="M 250 24 L 250 56 L 128 98 C 114 182, 130 310, 250 416 L 250 440 C 105 320, 90 170, 106 74 Z" 
          fill="#FFFFFF" fill-opacity="0.25" />

    <!-- 3. Inner Shield Face -->
    <path d="M 250 56 
             L 372 98 
             C 386 182, 370 310, 250 416 
             C 130 310, 114 182, 128 98 
             Z" 
          fill="url(#favInnerShieldBg)" />

    <!-- Inner Shield Outline Bevel -->
    <path d="M 250 56 L 372 98 C 386 182, 370 310, 250 416 C 130 310, 114 182, 128 98 Z" 
          fill="none" stroke="url(#favBevelGrad)" stroke-width="5" />

    <!-- 4. Circuit Traces on Left -->
    <!-- Trace 1 (Top) -->
    <path d="M 85 200 L 155 200 L 175 220 L 205 220" 
          fill="none" stroke="#00C0FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trace 2 (Middle) -->
    <path d="M 110 246 L 205 246" 
          fill="none" stroke="#0EA5E9" stroke-width="11" stroke-linecap="round" />
    <!-- Trace 3 (Bottom) -->
    <path d="M 88 292 L 155 292 L 175 272 L 205 272" 
          fill="none" stroke="#0284C7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Circuit Connection Glowing Nodes (Left Rings & Orbs) -->
    <!-- Node 1 -->
    <circle cx="85" cy="200" r="18" fill="url(#favShieldGrad)" stroke="#00E5FF" stroke-width="4" filter="url(#favNodeGlow)"/>
    <circle cx="85" cy="200" r="9" fill="#00E5FF"/>
    <!-- Node 2 -->
    <circle cx="110" cy="246" r="18" fill="url(#favShieldGrad)" stroke="#00E5FF" stroke-width="4" filter="url(#favNodeGlow)"/>
    <circle cx="110" cy="246" r="9" fill="#00E5FF"/>
    <!-- Node 3 -->
    <circle cx="88" cy="292" r="18" fill="url(#favShieldGrad)" stroke="#00E5FF" stroke-width="4" filter="url(#favNodeGlow)"/>
    <circle cx="88" cy="292" r="9" fill="#00E5FF"/>

    <!-- 5. Stylized 'J' Letterform -->
    <path d="M 172 135 
             L 242 135 
             L 242 278 
             C 242 325, 215 352, 172 352 
             L 142 316 
             L 165 316 
             C 188 316, 202 304, 202 278 
             L 202 165 
             L 172 165 
             Z" 
          fill="url(#favLetterGrad)" />

    <!-- 6. Stylized 'T' Letterform -->
    <path d="M 248 135 
             L 358 135 
             L 358 165 
             L 318 165 
             L 318 352 
             L 278 352 
             L 278 165 
             L 248 165 
             Z" 
          fill="url(#favLetterGrad)" />

    <!-- Letter bevel highlights -->
    <path d="M 248 135 L 358 135 L 358 143 L 248 143 Z" fill="#60A5FA" fill-opacity="0.6"/>
    <path d="M 172 135 L 242 135 L 242 143 L 172 143 Z" fill="#60A5FA" fill-opacity="0.6"/>
  </g>
</svg>
